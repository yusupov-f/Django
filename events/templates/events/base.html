<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Event Platform{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body id="page-top" class="d-flex flex-column min-vh-100 bg-light">
    
    <!-- Общая шапка (Navigation) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
      <div class="container px-4">
        <a class="navbar-brand" href="{% url 'event_list' %}">Event Platform</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'event_list' %}#events">События</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Сюда подставляется уникальный контент каждой страницы -->
    <main class="flex-grow-1" style="margin-top: 56px;">
      {% block content %}
      {% endblock %}
    </main>

    <!-- Общий подвал (Footer) -->
    <footer class="py-4 bg-dark text-white mt-auto">
      <div class="container text-center">
        <p class="m-0">&copy; Event Platform 2026</p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
