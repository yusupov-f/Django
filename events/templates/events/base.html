<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Event Platform{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body id="page-top" class="d-flex flex-column min-vh-100 bg-light">
    
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
      <div class="container px-4">
        <!-- ИЗМЕНЕНО: Исправлена ссылка event_list -> events:event_list -->
        <a class="navbar-brand" href="{% url 'events:event_list' %}">Event Platform</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <!-- ИЗМЕНЕНО: Добавлен префикс events: -->
              <a class="nav-link" href="{% url 'events:event_list' %}#events">События</a>
            </li>
            <li class="nav-item">
              <!-- ИЗМЕНЕНО: Добавлена кнопка создания события -->
              <a class="btn btn-outline-light ms-2" href="{% url 'events:event_create' %}">+ Создать событие</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1" style="margin-top: 56px;">
      <!-- ИЗМЕНЕНО: Вывод всплывающих сообщений из messages framework -->
      {% if messages %}
        <div class="container mt-3">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}
      {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="py-4 bg-dark text-white mt-auto">
      <div class="container text-center">
        <p class="m-0">&copy; Event Platform 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
